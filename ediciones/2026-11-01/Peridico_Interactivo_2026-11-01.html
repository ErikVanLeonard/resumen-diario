  line-height: 1.375;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-\[-\.04em\]{
  letter-spacing: -.04em;
}

.tracking-\[-\.055em\]{
  letter-spacing: -.055em;
}

.tracking-\[\.14em\]{
  letter-spacing: .14em;
}

.tracking-\[\.18em\]{
  letter-spacing: .18em;
}

.tracking-tight{
  letter-spacing: -0.025em;
}

.tracking-wide{
  letter-spacing: 0.025em;
}

.tracking-widest{
  letter-spacing: 0.1em;
}

.text-\[\#00ff88\]{
  --tw-text-opacity: 1;
  color: rgb(0 255 136 / var(--tw-text-opacity, 1));
}

.text-\[\#d7cfae\]{
  --tw-text-opacity: 1;
  color: rgb(215 207 174 / var(--tw-text-opacity, 1));
}

.text-\[\#d8d0bd\]{
  --tw-text-opacity: 1;
  color: rgb(216 208 189 / var(--tw-text-opacity, 1));
}

.text-\[\#f5f0e5\]{
  --tw-text-opacity: 1;
  color: rgb(245 240 229 / var(--tw-text-opacity, 1));
}

.text-\[var\(--muted\)\]{
  color: var(--muted);
}

.text-\[var\(--red\)\]{
  color: var(--red);
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-red-400{
  --tw-text-opacity: 1;
  color: rgb(248 113 113 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.text-white\/60{
  color: rgb(255 255 255 / 0.6);
}

.text-white\/70{
  color: rgb(255 255 255 / 0.7);
}

.text-white\/75{
  color: rgb(255 255 255 / 0.75);
}

.text-white\/80{
  color: rgb(255 255 255 / 0.8);
}

.opacity-20{
  opacity: 0.2;
}

.shadow-2xl{
  --tw-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --tw-shadow-colored: 0 25px 50px -12px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --paper:#f7f2e7;
  --paper-2:#efe7d5;
  --ink:#141310;
  --muted:#6d665a;
  --line:#1b1a17;
  --red:#c81d25;
  --gold:#b98a24;
  --green:#00ff88;
  --surface:#f7f2e7;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#171713;
    --paper-2:#211f1b;
    --ink:#f2ecdf;
    --muted:#b8b0a1;
    --line:#f2ecdf;
    --surface:#171713;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:#111;
  color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif
}

.serif{
  font-family:"Playfair Display",Georgia,serif
}

.newspaper{
  background:var(--paper)
}

.rule{
  border-top:2.5px solid var(--line)
}

.thin{
  border-top:1px solid color-mix(in srgb, var(--line) 28%, transparent)
}

.smallcaps{
  letter-spacing:.16em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:800
}

.dropcap::first-letter{
  font-family:"Playfair Display",Georgia,serif;
  font-size:64px;
  line-height:.72;
  float:left;
  padding:8px 10px 0 0;
  font-weight:900;
  color:var(--red)
}

.kicker{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  font-weight:900
}

a{
  color:inherit
}

.section-num{
  width:34px;
  height:34px;
  border:2px solid currentColor;
  display:grid;
  place-items:center;
  border-radius:50%;
  font-weight:900
}

.game-card{
  background:#07130c;
  border:1px solid #183f2b
}

.neon{
  color:var(--green);
  text-shadow:0 0 22px rgba(0,255,136,.35)
}

.pixel{
  font-family:"DM Sans",sans-serif;
  letter-spacing:.08em
}

@media(max-width:640px){
  .dropcap::first-letter{
    font-size:54px
  }
}

.hover\:text-\[var\(--red\)\]:hover{
  color: var(--red);
}

@media (min-width: 640px){
  .sm\:mx-7{
    margin-left: 1.75rem;
    margin-right: 1.75rem;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:px-7{
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:text-right{
    text-align: right;
  }

  .sm\:text-\[11px\]{
    font-size: 11px;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:col-span-5{
    grid-column: span 5 / span 5;
  }

  .md\:col-span-7{
    grid-column: span 7 / span 7;
  }

  .md\:block{
    display: block;
  }

  .md\:inline{
    display: inline;
  }

  .md\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }

  .md\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .md\:border-l{
    border-left-width: 1px;
  }

  .md\:p-7{
    padding: 1.75rem;
  }

  .md\:py-12{
    padding-top: 3rem;
    padding-bottom: 3rem;
  }

  .md\:pl-6{
    padding-left: 1.5rem;
  }

  .md\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .md\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .md\:text-6xl{
    font-size: 3.75rem;
    line-height: 1;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-5{
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7{
    grid-column: span 7 / span 7;
  }

  .lg\:mx-10{
    margin-left: 2.5rem;
    margin-right: 2.5rem;
  }

  .lg\:inline{
    display: inline;
  }

  .lg\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }

  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\]{
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1\.7fr_\.8fr\]{
    grid-template-columns: 1.7fr .8fr;
  }

  .lg\:px-10{
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }
}
