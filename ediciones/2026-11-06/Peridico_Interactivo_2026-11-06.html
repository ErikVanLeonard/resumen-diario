.tracking-\[0\.25em\]{
  letter-spacing: 0.25em;
}

.tracking-\[0\.2em\]{
  letter-spacing: 0.2em;
}

.tracking-\[0\.34em\]{
  letter-spacing: 0.34em;
}

.tracking-\[0\.3em\]{
  letter-spacing: 0.3em;
}

.tracking-tight{
  letter-spacing: -0.025em;
}

.tracking-wide{
  letter-spacing: 0.025em;
}

.tracking-wider{
  letter-spacing: 0.05em;
}

.tracking-widest{
  letter-spacing: 0.1em;
}

.text-\[\#00ff88\]{
  --tw-text-opacity: 1;
  color: rgb(0 255 136 / var(--tw-text-opacity, 1));
}

.text-\[var\(--ink\)\]{
  color: var(--ink);
}

.text-\[var\(--muted\)\]{
  color: var(--muted);
}

.text-\[var\(--paper\)\]{
  color: var(--paper);
}

.text-\[var\(--red\)\]{
  color: var(--red);
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.text-white\/60{
  color: rgb(255 255 255 / 0.6);
}

.text-white\/70{
  color: rgb(255 255 255 / 0.7);
}

.text-white\/80{
  color: rgb(255 255 255 / 0.8);
}

.underline{
  text-decoration-line: underline;
}

.opacity-30{
  opacity: 0.3;
}

.opacity-70{
  opacity: 0.7;
}

.opacity-80{
  opacity: 0.8;
}

.opacity-90{
  opacity: 0.9;
}

.shadow-\[0_0_60px_rgba\(0\2c 255\2c 136\2c 0\.18\)\]{
  --tw-shadow: 0 0 60px rgba(0,255,136,0.18);

  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.filter{

  transition-duration: 150ms;
}

:root{
  --paper:#f7f1de;
  --paper2:#efe6cc;
  --ink:#141310;
  --muted:#6b6350;
  --line:#141310;
  --red:#c81e1e;
  --gold:#c69a2d;
  --neon:#00ff88;
  --gamer-bg:#060d09;
  --gamer-card:#0d1d14;
  --surface:#f7f1de;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#171712;
    --paper2:#22221c;
    --ink:#f2ead4;
    --muted:#b8ad90;
    --line:#f2ead4;
    --surface:#171712;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif
}

.font-display{
  font-family:"Playfair Display",Georgia,serif
}

.font-gamer{
  font-family:"Space Grotesk",system-ui,sans-serif;
  letter-spacing:.02em
}

.newspaper-rule{
  border-top:3px double var(--ink);
  border-bottom:1px solid var(--ink)
}

.dropcap::first-letter{
  font-family:"Playfair Display",Georgia,serif;
  font-size:3.6rem;
  line-height:.8;
  float:left;
  padding:.45rem .6rem 0 0;
  color:var(--red);
  font-weight:900
}

.gamer-glow{
  text-shadow:0 0 18px rgba(0,255,136,.65),0 0 42px rgba(0,255,136,.28)
}

.gamer-card{
  background:linear-gradient(145deg,#0d1d14,#07100b);
  border:1px solid rgba(0,255,136,.28)
}

.tab-active{
  background:var(--ink);
  color:var(--paper)
}

.chip-active{
  background:var(--red);
  color:white;
  border-color:var(--red)
}

@media print{
  .no-print{
    display:none!important
  }
}

.hover\:bg-\[var\(--ink\)\]:hover{
  background-color: var(--ink);
}

.hover\:bg-\[var\(--paper2\)\]:hover{
  background-color: var(--paper2);
}

.hover\:text-\[var\(--paper\)\]:hover{
  color: var(--paper);
}

.dark\:bg-white\/5:is(.dark *){
  background-color: rgb(255 255 255 / 0.05);
}

@media (min-width: 640px){
  .sm\:ml-auto{
    margin-left: auto;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:rounded-2xl{
    border-radius: 1rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:ml-auto{
    margin-left: auto;
  }

  .md\:inline{
    display: inline;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-center{
    align-items: center;
  }

  .md\:divide-x-2 > :not([hidden]) ~ :not([hidden]){
    --tw-divide-x-reverse: 0;
    border-right-width: calc(2px * var(--tw-divide-x-reverse));
    border-left-width: calc(2px * calc(1 - var(--tw-divide-x-reverse)));
  }

  .md\:divide-y-0 > :not([hidden]) ~ :not([hidden]){
    --tw-divide-y-reverse: 0;
    border-top-width: calc(0px * calc(1 - var(--tw-divide-y-reverse)));
    border-bottom-width: calc(0px * var(--tw-divide-y-reverse));
  }
}

@media (min-width: 1024px){
  .lg\:col-span-4{
    grid-column: span 4 / span 4;
  }

  .lg\:col-span-5{
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7{
    grid-column: span 7 / span 7;
  }

  .lg\:col-span-8{
    grid-column: span 8 / span 8;
  }

  .lg\:grid-cols-12{
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }

  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-center{
    align-items: center;
  }

  .lg\:border-r{
    border-right-width: 1px;
  }

  .lg\:border-\[var\(--ink\)\]{
    border-color: var(--ink);
  }

  .lg\:pr-6{
    padding-right: 1.5rem;
  }
}
